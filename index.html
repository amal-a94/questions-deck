<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16202c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Questions">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>865 Questions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans+Arabic:wght@500;600&family=Inter:wght@400;500;600&display=swap">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}*{box-sizing:border-box}body{margin:0}button{-webkit-tap-highlight-color:transparent}[hidden]{display:none!important}</style>
<style>
/* Layout: one card at a time, a theme strip above, three big controls below; each theme tints the card. */
:root {
  --bg: #e9edf2;
  --surface: #ffffff;
  --ink: #16202c;
  --muted: #5a6677;
  --line: #cfd6df;
  --focus: #1f5fd1;
  --card-l: 93%;
  --card-s: 62%;
  --card-ink-l: 22%;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-ui: "Inter", "Segoe UI", system-ui, sans-serif;
  --font-ar: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10151c; --surface: #19212b; --ink: #e8edf3; --muted: #9aa6b6; --line: #2c3743; --focus: #7aa7ff;
    --card-l: 19%; --card-s: 34%; --card-ink-l: 88%; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10151c; --surface: #19212b; --ink: #e8edf3; --muted: #9aa6b6; --line: #2c3743; --focus: #7aa7ff;
  --card-l: 19%; --card-s: 34%; --card-ink-l: 88%; color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-ui);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.app { max-width: 560px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; gap: 14px; padding-block: 18px 22px; }
header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
h1 { font-family: var(--font-display); font-weight: 700; font-size: 1.35rem; margin: 0; letter-spacing: -0.01em; }
.count { color: var(--muted); font-size: .85rem; font-variant-numeric: tabular-nums; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; margin-inline: -4px; padding-inline: 4px; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none; border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  font: 500 .85rem var(--font-ui); padding: 8px 13px; border-radius: 999px; cursor: pointer; white-space: nowrap;
}
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-inline-end: 6px; vertical-align: 1px; background: hsl(var(--h) 60% 52%); }
.chip.ar { font-family: var(--font-ar); }
.stage { flex: 1; display: grid; min-height: 380px; touch-action: pan-y; }
.card {
  --h: 220;
  background: hsl(var(--h) var(--card-s) var(--card-l));
  color: hsl(var(--h) 35% var(--card-ink-l));
  border-radius: 22px; padding: 22px 22px 18px;
  display: flex; flex-direction: column; gap: 12px;
  box-shadow: 0 1px 0 hsl(var(--h) 30% 50% / .15), 0 18px 40px -24px hsl(var(--h) 40% 20% / .45);
  transition: transform .18s ease, opacity .18s ease;
  user-select: none;
}
.card.out-left { transform: translateX(-24px) rotate(-1.5deg); opacity: 0; }
.card.out-right { transform: translateX(24px) rotate(1.5deg); opacity: 0; }
.meta { display: flex; justify-content: space-between; gap: 10px; font-size: .78rem; text-transform: uppercase; letter-spacing: .08em; font-weight: 600; opacity: .8; }
.meta .no { font-variant-numeric: tabular-nums; letter-spacing: .04em; }
.q {
  flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 14px;
  font-family: var(--font-display); font-weight: 500; font-size: clamp(1.45rem, 5.4vw, 1.95rem); line-height: 1.22;
  text-wrap: balance; overflow-wrap: anywhere; min-width: 0;
}
.q[dir="rtl"] { font-family: var(--font-ar); font-weight: 600; line-height: 1.6; font-size: clamp(1.4rem, 5.2vw, 1.85rem); }
.q .gap { opacity: .55; font-style: italic; }
.opts { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; font-family: var(--font-ui); font-size: 1rem; line-height: 1.35; font-weight: 500; }
.opts li { display: flex; gap: 10px; align-items: baseline; padding: 9px 12px; border-radius: 12px; background: hsl(var(--h) 40% 50% / .1); }
.opts b { font-weight: 700; min-width: 1.1em; }
.src { font-size: .78rem; opacity: .7; }
.controls { display: grid; grid-template-columns: 1fr 1.2fr 1fr; gap: 10px; }
.btn {
  border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 14px;
  padding: 14px 10px; font: 600 1rem var(--font-ui); cursor: pointer;
}
.btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.opt-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; color: var(--muted); font-size: .85rem; }
.opt-row label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
.opt-row input { width: 18px; height: 18px; accent-color: var(--ink); }
.hint { color: var(--muted); }
button:focus-visible, input:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { .card { transition: none; } }
</style>

</head>
<body>
<div class="app">
  <header>
    <h1>865 Questions</h1>
    <span class="count" id="count" aria-live="polite">Loading the deck…</span>
  </header>

  <nav class="chips" id="chips" aria-label="Themes"></nav>

  <main class="stage" id="stage">
    <article class="card" id="card" aria-live="polite">
      <div class="meta"><span id="cat">Shuffling</span><span class="no" id="no"></span></div>
      <div class="q" id="q">Your saved questions are loading.</div>
      <div class="src" id="src"></div>
    </article>
  </main>

  <div class="controls">
    <button class="btn" id="prev" type="button" aria-label="Previous card">← Back</button>
    <button class="btn primary" id="shuffle" type="button">Shuffle</button>
    <button class="btn" id="next" type="button" aria-label="Next card">Next →</button>
  </div>

  <div class="opt-row">
    <label for="skipgaps"><input type="checkbox" id="skipgaps" checked> Skip cards with missing words</label>
    <span class="hint">Swipe or tap the card</span>
  </div>
</div>

<script>
(function () {
  const SHORT = ["Icebreakers", "Light & fun", "Would you rather", "Getting to know", "Deep talks", "Warm & comforting",
    "Best friends", "Couples", "Family", "Disagreements", "For yourself", "Quiz: know me?"];
  const HUES = [200, 38, 280, 160, 228, 18, 330, 350, 110, 0, 250, 52];
  const AR = /[؀-ۿ]/;
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };
  const $ = id => document.getElementById(id);
  let all = [], cats = [], deck = [], pos = 0;
  let filter = store.get("q818-filter", "all");
  let skipGaps = store.get("q818-skip", true);
  $("skipgaps").checked = skipGaps;

  const isGap = c => c.c !== 0 && c.q.includes("[");

  function shuffle(a) {
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  }
  function pool() {
    return all.filter(c =>
      (filter === "all" || (filter === "ar" ? AR.test(c.q) : c.c === filter)) && !(skipGaps && isGap(c)));
  }
  function rebuild() { deck = shuffle(pool()); pos = 0; render(); }

  function esc(s) { return s.replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch])); }
  function questionHTML(text) {
    let main = text, opts = null;
    const m = text.match(/^(.*[?:])\s*\((?:[aA]: )(.*)\)\s*$/);
    if (m) { main = m[1]; opts = m[2].split(" / ").map(s => s.replace(/^[a-dA-D]: /, "")); }
    let html = esc(main).replace(/\[([^\]]+)\]/g, '<span class="gap">[$1]</span>');
    if (opts) {
      html += '<ul class="opts">' + opts.map((o, i) => `<li><b>${"ABCD"[i]}</b><span>${esc(o)}</span></li>`).join("") + "</ul>";
    }
    return html;
  }

  function render(dir) {
    const card = $("card");
    $("count").textContent = deck.length ? `${pos + 1} of ${deck.length}` : "No cards";
    if (!deck.length) {
      card.style.setProperty("--h", 220);
      $("cat").textContent = "Empty"; $("no").textContent = "";
      $("q").removeAttribute("dir");
      $("q").textContent = "No cards match. Turn off “Skip cards with missing words” or pick another theme.";
      $("src").textContent = ""; return;
    }
    const c = deck[pos];
    const paint = () => {
      card.style.setProperty("--h", HUES[c.c]);
      $("cat").textContent = SHORT[c.c];
      $("no").textContent = "No. " + c.n;
      const q = $("q");
      if (AR.test(c.q)) q.setAttribute("dir", "rtl"); else q.removeAttribute("dir");
      q.innerHTML = questionHTML(c.q);
      $("src").textContent = c.s;
      card.classList.remove("out-left", "out-right");
    };
    if (dir && !matchMedia("(prefers-reduced-motion: reduce)").matches) {
      card.classList.add(dir === 1 ? "out-left" : "out-right");
      setTimeout(paint, 160);
    } else paint();
  }
  function step(d) { if (!deck.length) return; pos = (pos + d + deck.length) % deck.length; render(d); }

  function buildChips() {
    const nav = $("chips");
    const items = [["all", "All " + all.length, null], ...SHORT.map((s, i) => [i, s, HUES[i]]), ["ar", "العربية", null]];
    nav.innerHTML = "";
    items.forEach(([val, label, hue]) => {
      const b = document.createElement("button");
      b.type = "button"; b.className = "chip" + (val === "ar" ? " ar" : "");
      b.setAttribute("aria-pressed", String(val === filter));
      if (hue !== null) { b.style.setProperty("--h", hue); b.innerHTML = '<span class="dot"></span>'; }
      b.appendChild(document.createTextNode(label));
      b.addEventListener("click", () => {
        filter = val; store.set("q818-filter", val);
        nav.querySelectorAll(".chip").forEach(x => x.setAttribute("aria-pressed", "false"));
        b.setAttribute("aria-pressed", "true");
        rebuild();
      });
      nav.appendChild(b);
    });
    const on = nav.querySelector('[aria-pressed="true"]');
    if (on) on.scrollIntoView({ inline: "center", block: "nearest" });
  }

  $("prev").addEventListener("click", () => step(-1));
  $("next").addEventListener("click", () => step(1));
  $("shuffle").addEventListener("click", () => { deck = shuffle(deck); pos = 0; render(1); });
  $("skipgaps").addEventListener("change", e => { skipGaps = e.target.checked; store.set("q818-skip", skipGaps); rebuild(); });
  document.addEventListener("keydown", e => {
    if (e.target.closest("input")) return;
    if (e.key === "ArrowRight") step(1);
    else if (e.key === "ArrowLeft") step(-1);
  });
  let sx = null, sy = null;
  const stage = $("stage");
  stage.addEventListener("pointerdown", e => { sx = e.clientX; sy = e.clientY; });
  stage.addEventListener("pointerup", e => {
    if (sx === null) return;
    const dx = e.clientX - sx, dy = e.clientY - sy; sx = null;
    if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) step(dx < 0 ? 1 : -1);
    else if (Math.abs(dx) < 8 && Math.abs(dy) < 8) step(1);
  });

  fetch("questions.json").then(r => r.json()).then(data => {
    cats = data.cats; all = data.cards;
    if (filter !== "all" && filter !== "ar" && !(filter >= 0 && filter < SHORT.length)) filter = "all";
    buildChips(); rebuild();
  }).catch(() => {
    $("count").textContent = "";
    $("q").textContent = "The questions could not load. Reload the page to try again.";
  });
})();
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
  }
</script>

</body>
</html>
